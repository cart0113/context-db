  <text x="600" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-weight="800" font-size="104" letter-spacing="-5" fill="url(#palette)">/context-db</text>

  <!-- Subtitle -->
  <text x="600" y="510" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-weight="400" font-size="34" fill="#374151">A Markdown knowledge base for coding agents</text>
  <text x="600" y="560" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-weight="600" font-size="30" fill="#4338ca">Built on the Open Knowledge Format</text>
