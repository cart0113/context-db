<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="palette" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.35" stop-color="#0ea5e9"/>
      <stop offset="0.68" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background and the palette stripe -->
  <rect width="1200" height="630" fill="#f8fbff"/>
  <rect width="1200" height="14" fill="url(#palette)"/>

  <!-- Icon -->
  <g transform="translate(495, 70) scale(3.1)">
    <path d="M2 2L46 2L62 18L62 78L2 78Z" fill="#d4edda" stroke="#5a9a68" stroke-width="4" stroke-linejoin="round"/>
    <path d="M46 2L46 18L62 18" fill="#b8dcc0" stroke="#5a9a68" stroke-width="4" stroke-linejoin="round"/>
    <path d="M20 60L40 40" fill="none" stroke="#c4a8d8" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 34L46 34L46 50" fill="none" stroke="#c4a8d8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

