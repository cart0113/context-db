name: CI

on:
  push:
    branches: [v0.1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Official images, because hosted runners no longer ship Python 3.8.
    container: python:${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest pyyaml
      - run: python skill/context-db/context-db.py toc --check
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .
